name: Release Automation

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Draft Release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DEFAULT_AI_PROVIDER: gemini
      GEMINI_API_KEY: ci-placeholder-key-not-real
      OPENAI_API_KEY: ci-placeholder-key-not-real
      ANTHROPIC_API_KEY: ci-placeholder-key-not-real

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Build Tests
        run: |
          npm run lint
          npx tsc --noEmit
          npx vitest run
          npm run build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
